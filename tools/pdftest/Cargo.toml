[package]
name = "pdftest"
version = "0.1.0"
edition = "2021"
description = "Host test for Solon's PDF reader (src/pdf): renders pages to PNG"

[dependencies]
libm = "0.2"
spin = "0.9"
ttf-parser = { version = "0.25", default-features = false, features = ["glyph-names", "no-std-float"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zune-jpeg = { version = "0.5", default-features = false }
zune-png = { version = "0.5", default-features = false }
zune-core = { version = "0.5", default-features = false }
noto-sans-mono-bitmap = { version = "0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_32", "unicode-basic-latin", "unicode-specials"] }

[profile.release]
debug = false
overflow-checks = true
