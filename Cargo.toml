[package]
name = "solon"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.5"
x86_64 = "0.15"
spin = "0.9"
linked_list_allocator = "0.10.6"
noto-sans-mono-bitmap = { version = "0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_32", "unicode-basic-latin", "unicode-specials"] }
zune-jpeg = { version = "0.5", default-features = false }
zune-png = { version = "0.5", default-features = false }
zune-core = { version = "0.5", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false }

[profile.dev]
opt-level = 2  # unoptimized pixel loops are far too slow
panic = "abort"

[profile.release]
panic = "abort"
# Keep overflow checks on real hardware: a clear crash screen beats silent corruption.
overflow-checks = true
