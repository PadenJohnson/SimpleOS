# Solon, the SimpleOS kernel: one no_std Rust crate for 64-bit PCs, built for the bare-metal
# x86_64-unknown-none target (see .cargo/config.toml) and started by Limine. The dependencies
# are small no_std crates: Limine's boot protocol, x86-64 structures, locks, the heap
# allocator, JPEG/PNG and zlib codecs, maths, TrueType font parsing, and the ACPI tables and
# interpreter (vendor/acpi: the acpi crate with Solon's fixes; it logs through `log`).

[package]
name = "solon"
version = "0.1.0"
edition = "2021"

[dependencies]
limine = "0.5"
x86_64 = "0.15"
spin = "0.9"
linked_list_allocator = "0.10.6"
noto-sans-mono-bitmap = { version = "0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_32", "unicode-basic-latin", "unicode-specials"] }
zune-jpeg = { version = "0.5", default-features = false }
zune-png = { version = "0.5", default-features = false }
zune-core = { version = "0.5", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
libm = "0.2"
ttf-parser = { version = "0.25", default-features = false, features = ["glyph-names", "no-std-float"] }
acpi = { path = "vendor/acpi", default-features = false, features = ["aml"] }
log = "0.4"

[profile.dev]
opt-level = 2  # unoptimized pixel loops are far too slow
panic = "abort"

[profile.release]
panic = "abort"
# Keep overflow checks on real hardware: a clear crash screen beats silent corruption.
overflow-checks = true
